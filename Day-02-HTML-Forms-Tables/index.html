<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Styles.css"> 
  <title>Student Registration</title>
</head>
<body>
  <header>
    <h1>Java Full-Stack Learning Registration</h1>
  </header>

  <main>
    <section>
      <h2>Registration Form</h2>

      <form>
        <p>
          <label for="name">Full Name</label><br>
          <input type="text" id="name" name="name" required>
        </p>

        <p>
          <label for="DOB">Date of Birth</label><br>
          <input type="date" id="dob" name="dob" required>
        </p>

        <p>
          <label for="email">Email Address</label><br>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="phno">Phone Number</label><br>
          <input type="tel" id="number" name="number" max="10" required>
        </p>

        <p>
          <label for="track">Choose Your Track</label><br>
          <select id="track" name="track" required>
            <option value="">Select one</option>
            <option value="frontend">Frontend</option>
            <option value="java">Java Backend</option>
            <option value="fullstack">Full Stack</option>
          </select>
        </p>

        <p>
          <label for="goal">Your Learning Goal</label><br>
          <textarea id="goal" name="goal" rows="4" required></textarea>
        </p>
        <p>
          <input type="checkbox" id="subscribe" name="newsletter" value="yes" required>
          <label for="subscribe">I accept the terms</label>
        </p>        
        
        <button type="submit">Register</button>
      </form>
    </section>

    <section>
      <h2>Learning Progress</h2>

      <table border="1">
        <thead>
          <tr>
            <th>Day</th>
            <th>Topic</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>HTML5 Basics</td>
            <td>Completed</td>
          </tr>
          <tr>
            <td>2</td>
            <td>HTML Forms and Tables</td>
            <td>In Progress</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>© 2026 Punith</p>
  </footer>
</body>
</html>
